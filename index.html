<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Progress Chef 360 console for node management, declarative state management and fleet operations."
    />
    <title>Progress Chef 360 Console</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var route = params.get("p");
        if (!route) return;

        params.delete("p");
        var query = params.toString();
        window.history.replaceState(
          null,
          "",
          route + (query ? "?" + query : "") + window.location.hash,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
